<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Flex:Portfolio &mdash; Blackcurrent</title>

  <script>
    (function () {
      try {
        var stored = localStorage.getItem('flex-theme');
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = stored || (prefersDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>
  <script>try{var b=localStorage.getItem("flex-brand");if(b)document.documentElement.setAttribute("data-brand",b);}catch(e){}</script>

  <link rel="stylesheet" href="assets/flex-platform.css" />

  <style>
    /* Portfolio-only: lock the whole page to viewport height so the Sites
       table is the only scrolling region. Each ancestor must allow its child
       to shrink (min-height: 0) and the .page must override the default
       flex-shrink: 0 inherited from .page in the shared CSS.

       Layout chain:
         html/body   = 100vh, no scroll
         .app        = 100vh, no scroll
         .main       = 100vh flex column, no scroll
           .topbar       (auto)
           .page         (flex: 1, no overflow)
             .page-head     (auto)
             .coverage      (auto)
             .card          (flex: 1, no overflow)  ← Sites card
               .card-head     (auto)
               .table-wrap    (flex: 1, OVERFLOW-Y: AUTO) ← only scroller
           .footer-lockup (auto)                                 */
    html, body[data-page="portfolio"] {
      height: 100vh; overflow: hidden;
    }
    body[data-page="portfolio"] .frame { height: 100vh; }
    body[data-page="portfolio"] .app   { height: 100vh; min-height: 0; }
    body[data-page="portfolio"] .main  { height: 100vh; min-height: 0; overflow: hidden; }
    body[data-page="portfolio"] .page {
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    body[data-page="portfolio"] .page > .card:last-of-type {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      margin-bottom: 0;
    }
    body[data-page="portfolio"] .page > .card:last-of-type .table-wrap {
      flex: 1 1 auto;
      min-height: 0;
      max-height: none;
      overflow-y: auto;
      margin-bottom: 0;
      border-radius: 0 0 3px 3px;
    }
  </style>
</head>
<body data-page="portfolio">

<div class="frame">
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <div class="app">

    <!-- ================= SIDEBAR ================= -->
    <aside class="sidebar" id="sidebar">
    </aside>

    <!-- ================= MAIN ================= -->
    <section class="main">
      <div class="topbar">
        <button class="menu-btn" id="menuBtn" aria-label="Open menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square">
            <line x1="4" y1="7" x2="20" y2="7"/>
            <line x1="4" y1="12" x2="20" y2="12"/>
            <line x1="4" y1="17" x2="20" y2="17"/>
          </svg>
        </button>
        <div class="breadcrumb">PORTFOLIO / <strong>OVERVIEW</strong></div>
        <div class="topbar-right">
          <div class="site-selector">
            <span>All sites</span>
            <span class="chev">&#9662;</span>
          </div>
          <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode" title="Toggle dark mode">
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="4"/>
              <line x1="12" y1="2" x2="12" y2="5"/>
              <line x1="12" y1="19" x2="12" y2="22"/>
              <line x1="2" y1="12" x2="5" y2="12"/>
              <line x1="19" y1="12" x2="22" y2="12"/>
              <line x1="4.93" y1="4.93" x2="7.05" y2="7.05"/>
              <line x1="16.95" y1="16.95" x2="19.07" y2="19.07"/>
              <line x1="4.93" y1="19.07" x2="7.05" y2="16.95"/>
              <line x1="16.95" y1="7.05" x2="19.07" y2="4.93"/>
            </svg>
          </button>
          <div class="avatar">PU</div>
        </div>
      </div>

      <main class="page">

        <header class="page-head">
          <h1>Flex:Portfolio</h1>
          <p class="page-sub">All sites at a glance &mdash; status, consumption, and active flex.</p>
        </header>

        <!-- Summary tiles -->
        <div class="coverage" id="summaryTiles" style="margin-bottom: 24px;">
          <!-- populated by script -->
        </div>

        <!-- Sites table -->
        <div class="card">
          <div class="card-head" style="margin-bottom: 14px;">
            <h2 style="margin: 0; font-size: 16px;">Sites <span id="siteCount" style="color: var(--steel); font-weight: 500; margin-left: 6px; font-size: 13px;"></span></h2>
            <div style="display: flex; gap: 8px; align-items: center;">
              <input type="search" id="siteSearch" class="input" placeholder="Search sites or customers…" style="width: 220px; max-width: 100%;" />
              <select id="sectorFilter" class="select" style="width: auto;">
                <option value="">All sectors</option>
              </select>
              <select id="statusFilter" class="select" style="width: auto;">
                <option value="">All statuses</option>
                <option value="ok">Online</option>
                <option value="warn">Stale</option>
                <option value="fault">Offline</option>
                <option value="pending">Pending</option>
              </select>
            </div>
          </div>
          <div class="table-wrap">
            <table class="preview">
              <thead>
                <tr>
                  <th>Site</th>
                  <th>Customer</th>
                  <th>Sector</th>
                  <th>ICP</th>
                  <th>Status</th>
                  <th>Last reading</th>
                  <th class="num">24h kWh</th>
                  <th>Active flex</th>
                </tr>
              </thead>
              <tbody id="sitesBody">
                <!-- rows injected by script -->
              </tbody>
            </table>
          </div>
        </div>

      </main>
    </section>
  </div>
</div>

<script src="https://unpkg.com/lucide/dist/umd/lucide.min.js"></script>
<script src="assets/flex-nav.js"></script>
<script src="assets/flex-platform.js"></script>
<script src="data/sites_and_customers.js"></script>
<script>
// =====================================================
// Flex:Portfolio — pulls from window.FlexData
// =====================================================
(function () {
  'use strict';
  var U = window.FlexUtil;
  var data = window.FlexData;

  if (!data || !Array.isArray(data.sites)) {
    document.getElementById('sitesBody').innerHTML =
      '<tr><td colspan="8"><em>Couldn\'t load sites_and_customers.js — check that the file is present in /data.</em></td></tr>';
    return;
  }

  var STATUS_LABEL = { ok: 'Online', warn: 'Stale', fault: 'Offline', pending: 'Pending' };

  // -------- Summary tiles --------
  function renderSummary() {
    var sites = data.sites;
    var byStatus = sites.reduce(function (acc, s) { acc[s.status] = (acc[s.status]||0)+1; return acc; }, {});
    var connected = (byStatus.ok || 0) + (byStatus.warn || 0);
    var total24 = sites.reduce(function (sum, s) { return sum + (s.kwh_24h || 0); }, 0);
    var activeFlex = sites.filter(function (s) { return s.active_flex && s.active_flex !== '—'; }).length;
    var withTelemetry = sites.filter(function (s) { return s.status !== 'pending'; }).length;
    var dataQualityPct = (withTelemetry / sites.length) * 100;
    var customers = data.customers ? data.customers.length : new Set(sites.map(function(s){return s.customer_id;})).size;

    document.getElementById('summaryTiles').innerHTML =
        tile('Sites', String(sites.length), customers + ' customers · ' + connected + ' streaming')
      + tile('Last 24h consumption', U.fmtNum(Math.round(total24)) + ' <span class="unit">kWh</span>', 'Across ' + connected + ' active sites')
      + tile('Active flex', String(activeFlex), activeFlex === 0 ? 'None active' : (sites.length - activeFlex) + ' eligible but inactive')
      + tile('Data coverage', dataQualityPct.toFixed(1) + '%', withTelemetry + ' of ' + sites.length + ' sites streaming');
  }
  function tile(label, value, sub) {
    return '<div class="stat">'
      + '<div class="label">' + label + '</div>'
      + '<div class="value">' + value + '</div>'
      + '<div class="sub">' + sub + '</div>'
      + '</div>';
  }

  // -------- Sector filter options --------
  function populateSectorFilter() {
    var sectors = Array.from(new Set(data.sites.map(function (s) { return s.sector; }).filter(Boolean))).sort();
    var sel = document.getElementById('sectorFilter');
    sectors.forEach(function (s) {
      var o = document.createElement('option');
      o.value = s; o.textContent = s;
      sel.appendChild(o);
    });
  }

  // -------- Table render --------
  function renderTable() {
    var search = (document.getElementById('siteSearch').value || '').toLowerCase().trim();
    var sectorF = document.getElementById('sectorFilter').value;
    var statusF = document.getElementById('statusFilter').value;

    var filtered = data.sites.filter(function (s) {
      if (sectorF && s.sector !== sectorF) return false;
      if (statusF && s.status !== statusF) return false;
      if (search) {
        var hay = (s.name + ' ' + s.customer_name + ' ' + s.icp + ' ' + (s.address||'')).toLowerCase();
        if (hay.indexOf(search) === -1) return false;
      }
      return true;
    });

    // sort: pending sites last, then by 24h kWh desc
    filtered.sort(function (a, b) {
      var ap = a.status === 'pending' ? 1 : 0;
      var bp = b.status === 'pending' ? 1 : 0;
      if (ap !== bp) return ap - bp;
      return (b.kwh_24h || 0) - (a.kwh_24h || 0);
    });

    document.getElementById('siteCount').textContent =
      '· ' + filtered.length + (filtered.length === data.sites.length ? '' : ' of ' + data.sites.length);

    if (!filtered.length) {
      document.getElementById('sitesBody').innerHTML =
        '<tr><td colspan="8" style="text-align:center; color:var(--steel); padding: 24px;">No sites match these filters.</td></tr>';
      return;
    }

    document.getElementById('sitesBody').innerHTML = filtered.map(function (s) {
      var statusFlag = '<span class="flag ' + s.status + '">' + STATUS_LABEL[s.status] + '</span>';
      var lastReading = s.last_reading
        ? '<span style="font-variant-numeric: tabular-nums;">' + U.escapeHtml(s.last_reading) + '</span>'
        : '<span class="empty">—</span>';
      var kwh24 = s.last_reading
        ? U.fmtNum(Math.round(s.kwh_24h))
        : '<span class="empty">—</span>';
      var flexCell = s.active_flex && s.active_flex !== '—'
        ? '<span class="flag ok">' + U.escapeHtml(s.active_flex) + '</span>'
        : '<span class="empty">—</span>';
      return '<tr>'
        + '<td><button class="link-detail" data-site-id="' + s.id + '">'
        +   '<strong>' + U.escapeHtml(s.name) + '</strong>'
        + '</button></td>'
        + '<td>' + U.escapeHtml(s.customer_name) + '</td>'
        + '<td>' + U.escapeHtml(s.sector || '—') + '</td>'
        + '<td><code style="font-size: 11px;">' + U.escapeHtml(s.icp) + '</code></td>'
        + '<td>' + statusFlag + '</td>'
        + '<td>' + lastReading + '</td>'
        + '<td class="num">' + kwh24 + '</td>'
        + '<td>' + flexCell + '</td>'
        + '</tr>';
    }).join('');
  }

  var STATUS_LABEL_FULL = STATUS_LABEL;

  // -------- Site detail modal --------
  function showSite(siteId) {
    var site = data.sites.find(function (s) { return s.id === siteId; });
    if (!site) return;
    var customer = data.customers.find(function (c) { return c.id === site.customer_id; });

    // Stat row (2 tiles: status + active flex)
    var statusBadge = '<span class="flag ' + site.status + '">' + STATUS_LABEL_FULL[site.status] + '</span>';
    var flexBadge = site.active_flex && site.active_flex !== '—'
      ? '<span class="flag ok">' + U.escapeHtml(site.active_flex) + '</span>'
      : '<span class="empty">None active</span>';

    // Equipment summary helpers
    var eq = [];
    if (site.pv_size_kwp > 0) eq.push(site.pv_size_kwp + ' kWp PV');
    if (site.has_battery && site.battery_capacity_kwh > 0) eq.push(site.battery_capacity_kwh + ' kWh battery');
    if (site.inverter_size_kw > 0) eq.push(site.inverter_size_kw + ' kW inverter');
    var equipSummary = eq.length ? eq.join(' · ') : 'No on-site generation or storage';

    // Coordinates
    var coord = (site.latitude != null && site.longitude != null)
      ? site.latitude.toFixed(4) + ', ' + site.longitude.toFixed(4)
      : null;

    // Build modal HTML
    var html =
        '<div class="cust-stat-row" style="grid-template-columns: repeat(2, minmax(180px, 240px));">'
      +   stat('Status', statusBadge, site.last_reading ? 'Last reading ' + site.last_reading : 'Awaiting first reading')
      +   stat('Active flex', flexBadge, '')
      + '</div>'

      + '<div class="cust-grid">'
      +   '<div class="cust-section">'
      +     '<div class="cust-section-title">Identity &amp; location</div>'
      +     kv('Customer', customer ? customer.name : site.customer_name)
      +     kv('Sector', site.sector || '—')
      +     kv('Address', site.address || '—')
      +     kv('ICP', '<code style="font-size: 11px;">' + U.escapeHtml(site.icp) + '</code>', true)
      +     kv('GXP', site.gxp || '—')
      +     kv('Coordinates', coord || '—')
      +   '</div>'
      +   '<div class="cust-section">'
      +     '<div class="cust-section-title">Equipment &amp; capacity</div>'
      +     kv('Primary fuse', site.primary_fuse_size_a ? site.primary_fuse_size_a + ' A' : '—')
      +     kv('PV (solar)', site.pv_size_kwp > 0 ? site.pv_size_kwp.toFixed(1) + ' kWp' : 'None installed')
      +     kv('Battery', (site.has_battery && site.battery_capacity_kwh > 0) ? site.battery_capacity_kwh.toFixed(1) + ' kWh' : 'None installed')
      +     kv('Inverter', site.inverter_size_kw > 0 ? site.inverter_size_kw.toFixed(1) + ' kW' : '—')
      +     kv('Summary', equipSummary)
      +   '</div>'
      + '</div>';

    FlexModal.open({
      eyebrow: 'Site',
      title: site.name,
      html: html
    });
  }

  function showCustomer(customerId) {
    var customer = data.customers.find(function (c) { return c.id === customerId; });
    if (!customer) return;
    var sites = data.sites.filter(function (s) { return s.customer_id === customerId; });

    // aggregate stats
    var total24 = sites.reduce(function (sum, s) { return sum + (s.kwh_24h || 0); }, 0);
    var total30 = sites.reduce(function (sum, s) { return sum + (s.kwh_30d || 0); }, 0);
    var streamingCount = sites.filter(function (s) { return s.status !== 'pending'; }).length;
    var activeFlexCount = sites.filter(function (s) { return s.active_flex && s.active_flex !== '—'; }).length;
    var totalPv = sites.reduce(function (sum, s) { return sum + (s.pv_size_kwp || 0); }, 0);
    var totalBattery = sites.reduce(function (sum, s) { return sum + (s.battery_capacity_kwh || 0); }, 0);

    var emailHtml = customer.key_contact_email
      ? '<a href="mailto:' + U.escapeHtml(customer.key_contact_email) + '">' + U.escapeHtml(customer.key_contact_email) + '</a>'
      : '<span class="empty">Not set</span>';

    var html =
        '<div class="cust-stat-row">'
      +   stat('Sites', String(sites.length), streamingCount + ' streaming')
      +   stat('24h consumption', U.fmtNum(Math.round(total24)) + '<span class="unit">kWh</span>', '')
      +   stat('30d consumption', U.fmtNum(Math.round(total30)) + '<span class="unit">kWh</span>', '')
      +   stat('Active flex', String(activeFlexCount), activeFlexCount === 0 ? 'None active' : 'of ' + sites.length + ' sites')
      + '</div>'

      + '<div class="cust-grid">'
      +   '<div class="cust-section">'
      +     '<div class="cust-section-title">Contact</div>'
      +     kv('Customer name', customer.full_name || customer.name)
      +     kv('Sector', customer.sector || '—')
      +     kv('Region', customer.region || '—')
      +     kv('Primary address', customer.primary_address || '—')
      +     kv('Key contact', emailHtml, true)
      +   '</div>'
      +   '<div class="cust-section">'
      +     '<div class="cust-section-title">Portfolio capability</div>'
      +     kv('Sites', String(sites.length))
      +     kv('Total PV', totalPv > 0 ? totalPv.toFixed(1) + ' kWp' : 'None installed')
      +     kv('Total battery', totalBattery > 0 ? totalBattery.toFixed(1) + ' kWh' : 'None installed')
      +     kv('Sectors covered', sectorsForCustomer(sites))
      +   '</div>'
      + '</div>'

      + '<div class="cust-section-title" style="margin-bottom: 8px;">Sites</div>'
      + '<div class="table-wrap" style="margin: 0;">'
      +   '<table class="preview">'
      +     '<thead><tr>'
      +       '<th>Name</th>'
      +       '<th>ICP</th>'
      +       '<th>Status</th>'
      +       '<th class="num">24h kWh</th>'
      +       '<th class="num">30d kWh</th>'
      +       '<th>PV / Battery</th>'
      +       '<th>Active flex</th>'
      +     '</tr></thead>'
      +     '<tbody>' + sites.map(siteRow).join('') + '</tbody>'
      +   '</table>'
      + '</div>';

    FlexModal.open({
      eyebrow: 'Customer',
      title: customer.name,
      html: html
    });
  }

  function sectorsForCustomer(sites) {
    var s = Array.from(new Set(sites.map(function (x) { return x.sector; }).filter(Boolean)));
    return s.length ? s.join(', ') : '—';
  }
  function siteRow(s) {
    var pvBat = [];
    if (s.pv_size_kwp > 0) pvBat.push(s.pv_size_kwp + 'kWp PV');
    if (s.battery_capacity_kwh > 0) pvBat.push(s.battery_capacity_kwh + 'kWh batt');
    var pvBatTxt = pvBat.length ? pvBat.join(' · ') : '<span class="empty">—</span>';
    var statusFlag = '<span class="flag ' + s.status + '">' + STATUS_LABEL_FULL[s.status] + '</span>';
    var flexCell = s.active_flex && s.active_flex !== '—'
      ? '<span class="flag ok">' + U.escapeHtml(s.active_flex) + '</span>'
      : '<span class="empty">—</span>';
    return '<tr>'
      + '<td><strong>' + U.escapeHtml(s.name) + '</strong></td>'
      + '<td><code style="font-size: 11px;">' + U.escapeHtml(s.icp) + '</code></td>'
      + '<td>' + statusFlag + '</td>'
      + '<td class="num">' + (s.last_reading ? U.fmtNum(Math.round(s.kwh_24h)) : '<span class="empty">—</span>') + '</td>'
      + '<td class="num">' + (s.kwh_30d > 0 ? U.fmtNum(Math.round(s.kwh_30d)) : '<span class="empty">—</span>') + '</td>'
      + '<td>' + pvBatTxt + '</td>'
      + '<td>' + flexCell + '</td>'
      + '</tr>';
  }
  function kv(key, val, isHtml) {
    var v = isHtml ? val : U.escapeHtml(String(val));
    return '<div class="cust-kv"><span class="key">' + key + '</span><span class="val">' + v + '</span></div>';
  }
  function stat(label, value, sub) {
    return '<div class="cust-stat">'
      + '<div class="label">' + label + '</div>'
      + '<div class="value">' + value + '</div>'
      + (sub ? '<div class="sub" style="font-size: 11px; color: var(--muted); margin-top: 2px;">' + sub + '</div>' : '')
      + '</div>';
  }

  // -------- wire up --------
  populateSectorFilter();
  renderSummary();
  renderTable();

  ['siteSearch', 'sectorFilter', 'statusFilter'].forEach(function (id) {
    var el = document.getElementById(id);
    el.addEventListener(el.tagName === 'SELECT' ? 'change' : 'input', renderTable);
  });

  // Delegated click on site-name buttons in the Sites table
  document.getElementById('sitesBody').addEventListener('click', function (e) {
    var btn = e.target.closest('.link-detail');
    if (!btn) return;
    var id = parseInt(btn.dataset.siteId, 10);
    if (!isNaN(id)) showSite(id);
  });
})();
</script>
</body>
</html>
