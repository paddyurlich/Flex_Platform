<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Flex:Health &mdash; Blackcurrent</title>

  <script>
    (function () {
      try {
        var stored = localStorage.getItem('flex-theme');
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = stored || (prefersDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>
  <script>try{var b=localStorage.getItem("flex-brand");if(b)document.documentElement.setAttribute("data-brand",b);}catch(e){}</script>

  <link rel="stylesheet" href="assets/flex-platform.css" />

  <style>
    /* ── Full-height locked table layout ──────────────────────── */
    html, body[data-page="health"] { height: 100vh; overflow: hidden; }
    body[data-page="health"] .frame { height: 100vh; }
    body[data-page="health"] .app   { height: 100vh; min-height: 0; }
    body[data-page="health"] .main  { height: 100vh; min-height: 0; overflow: hidden; }
    body[data-page="health"] .page  {
      flex: 1 1 auto; min-height: 0; overflow: hidden;
      display: flex; flex-direction: column;
    }
    body[data-page="health"] .page > .card:last-of-type {
      flex: 1 1 auto; min-height: 0;
      display: flex; flex-direction: column;
      margin-bottom: 0;
    }
    body[data-page="health"] .page > .card:last-of-type .table-wrap {
      flex: 1 1 auto; min-height: 0; max-height: none;
      overflow-y: auto; margin-bottom: 0;
      border-radius: 0 0 3px 3px;
    }

    /* ── Live badge ───────────────────────────────────────────── */
    .live-badge {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.08em; color: var(--status-ok);
      background: color-mix(in srgb, var(--status-ok) 12%, transparent);
      border: 1px solid color-mix(in srgb, var(--status-ok) 30%, transparent);
      padding: 2px 9px 2px 7px; border-radius: 999px;
    }
    .live-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--status-ok);
      animation: pulse-dot 2s ease-in-out infinite;
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.5; transform: scale(0.7); }
    }

    /* ── Summary stat chips ───────────────────────────────────── */
    .health-summary {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px; margin-bottom: 14px;
    }
    @media (max-width: 780px) { .health-summary { grid-template-columns: repeat(2, 1fr); } }
    .hs-chip {
      background: var(--white); border: 1px solid var(--line);
      border-radius: 3px; padding: 11px 14px;
      display: flex; align-items: center; gap: 10px;
    }
    [data-theme="dark"] .hs-chip { background: #201d19; border-color: #2e2a25; }
    .hs-dot {
      width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
    }
    .hs-dot.ok      { background: var(--status-ok); }
    .hs-dot.warn    { background: var(--status-warn); }
    .hs-dot.fault   { background: var(--status-fault); }
    .hs-dot.pending { background: var(--status-pending); }
    .hs-text { display: flex; flex-direction: column; gap: 1px; }
    .hs-val {
      font-size: 20px; font-weight: 800; line-height: 1;
      color: var(--charcoal); font-family: var(--mono);
      font-variant-numeric: tabular-nums;
    }
    [data-theme="dark"] .hs-val { color: var(--egg); }
    .hs-label { font-size: 11px; color: var(--steel); text-transform: uppercase; letter-spacing: 0.07em; }

    /* ── Filter bar ───────────────────────────────────────────── */
    .health-filter {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .health-filter .input { width: 220px; }
    .health-count { font-size: 12px; color: var(--steel); margin-left: auto; white-space: nowrap; }


    /* Alarm count badge */
    .alarm-badge {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 20px; height: 20px; border-radius: 3px;
      font-size: 11px; font-weight: 800; font-family: var(--mono);
      padding: 0 5px;
    }
    .alarm-badge.none   { color: var(--steel); }
    .alarm-badge.active { background: color-mix(in srgb, var(--status-fault) 15%, transparent); color: var(--status-fault); }
    .alarm-badge.warn   { background: color-mix(in srgb, var(--status-warn)  15%, transparent); color: var(--status-warn); }

    /* Customer cell */
    .hc-customer { font-weight: 700; color: var(--charcoal); display: block; }
    [data-theme="dark"] .hc-customer { color: var(--egg); }
    .hc-sector { font-size: 11px; color: var(--steel); }

    /* Site cell */
    .hc-site { font-size: 13px; color: var(--charcoal); display: block; }
    [data-theme="dark"] .hc-site { color: var(--egg); }
    .hc-addr { font-size: 11px; color: var(--steel); }

    /* Sortable column header */
    th.sortable { cursor: pointer; user-select: none; }
    th.sortable:hover { color: var(--charcoal); }
    th.sort-asc::after  { content: ' ↑'; opacity: 0.6; }
    th.sort-desc::after { content: ' ↓'; opacity: 0.6; }
    [data-theme="dark"] th.sortable:hover { color: var(--egg); }

    /* Row hover */
    .preview tbody tr { cursor: default; }
    .preview tbody tr:hover td { background: color-mix(in srgb, var(--rust) 5%, transparent); }
  </style>
</head>

<script src="assets/flex-platform.js"></script>
<script>
(function () {
  'use strict';
  var U = window.FlexUtil;
  var data = window.FlexData;

  if (!data || !Array.isArray(data.sites)) {
    document.getElementById('healthBody').innerHTML =
      '<tr><td colspan="7" style="text-align:center;color:var(--steel);padding:24px;">Could not load sites_and_customers.js.</td></tr>';
    return;
  }

  /* ── Compute health signals for a site ──────────────────────── */
  function signals(site) {
    /* Telemetry: is the device phoning home? */
    var telemetry = site.status === 'pending' ? 'pending'
      : site.status === 'fault'   ? 'fault'
      : site.status === 'warn'    ? 'warn'
      : 'ok';

    /* Ingest: is usable energy data flowing? */
    var ingest;
    if (site.status === 'pending' || site.last_reading === null) {
      ingest = site.status === 'pending' ? 'pending' : 'fault';
    } else if (site.kwh_24h === 0) {
      ingest = 'warn';
    } else {
      ingest = 'ok';
    }

    var alarmCount = site.status === 'fault' ? 1 : (site.status === 'warn' ? 1 : 0);
    var alarmLevel = site.status === 'fault' ? 'fault' : (site.status === 'warn' ? 'warn' : 'none');
    var isUnhealthy = site.status === 'fault' || site.status === 'warn';
    var hasIngestProblem = ingest === 'fault' || ingest === 'warn';

    return { telemetry: telemetry, ingest: ingest, alarmCount: alarmCount, alarmLevel: alarmLevel, isUnhealthy: isUnhealthy, hasIngestProblem: hasIngestProblem };
  }

  /* ── Sort state ──────────────────────────────────────────────── */
  var sortCol = 'status';
  var sortDir = 'asc';

  var STATUS_ORDER = { fault: 0, warn: 1, ok: 2, pending: 3 };

  function sortValue(site, col) {
    var sig = signals(site);
    switch (col) {
      case 'customer': return (site.customer_name || '').toLowerCase();
      case 'status':   return STATUS_ORDER[site.status] != null ? STATUS_ORDER[site.status] : 9;
      case 'telemetry': return STATUS_ORDER[sig.telemetry] != null ? STATUS_ORDER[sig.telemetry] : 9;
      case 'ingest':   return STATUS_ORDER[sig.ingest] != null ? STATUS_ORDER[sig.ingest] : 9;
      case 'alarms':   return sig.alarmCount;
      case 'lastseen': return site.last_reading || '';
      default: return '';
    }
  }

  /* ── Active filter ───────────────────────────────────────────── */
  var activeFilter = 'all';

  /* ── Summary chips ───────────────────────────────────────────── */
  function renderSummary() {
    var counts = { ok: 0, warn: 0, fault: 0, pending: 0 };
    data.sites.forEach(function (s) { counts[s.status] = (counts[s.status] || 0) + 1; });
    var labels = { ok: 'Healthy', warn: 'Warning', fault: 'Fault', pending: 'Pending' };
    document.getElementById('healthSummary').innerHTML = ['ok', 'warn', 'fault', 'pending'].map(function (st) {
      return '<div class="hs-chip">'
        + '<div class="hs-dot ' + st + '"></div>'
        + '<div class="hs-text">'
        +   '<div class="hs-val">' + (counts[st] || 0) + '</div>'
        +   '<div class="hs-label">' + labels[st] + '</div>'
        + '</div>'
        + '</div>';
    }).join('');
  }

  /* ── Render table ────────────────────────────────────────────── */
  function pill(status, label) {
    return '<span class="flag ' + status + '">' + label + '</span>';
  }

  var STATUS_LABEL  = { ok: 'Online',  warn: 'Stale',   fault: 'Offline', pending: 'Pending' };
  var INGEST_LABEL  = { ok: 'Healthy', warn: 'No data', fault: 'Missing', pending: 'Pending' };
  var TELEMETRY_LABEL = { ok: 'Live',  warn: 'Stale',   fault: 'Lost',    pending: 'Pending' };

  function renderTable() {
    var search = (document.getElementById('healthSearch').value || '').toLowerCase().trim();

    var rows = data.sites.filter(function (s) {
      var sig = signals(s);
      if (activeFilter === 'unhealthy'  && !sig.isUnhealthy)      return false;
      if (activeFilter === 'ingest'     && !sig.hasIngestProblem)  return false;
      if (activeFilter === 'alarms'     && sig.alarmLevel === 'none') return false;
      if (search) {
        var hay = ((s.customer_name || '') + ' ' + (s.name || '') + ' ' + (s.address || '')).toLowerCase();
        if (hay.indexOf(search) === -1) return false;
      }
      return true;
    });

    rows.sort(function (a, b) {
      var av = sortValue(a, sortCol);
      var bv = sortValue(b, sortCol);
      if (av < bv) return sortDir === 'asc' ? -1 : 1;
      if (av > bv) return sortDir === 'asc' ?  1 : -1;
      /* secondary: fault > warn > ok > pending */
      return (STATUS_ORDER[a.status] || 9) - (STATUS_ORDER[b.status] || 9);
    });

    var total = data.sites.length;
    document.getElementById('healthCount').textContent =
      rows.length + (rows.length === total ? '' : ' of ' + total) + ' sites';

    if (!rows.length) {
      document.getElementById('healthBody').innerHTML =
        '<tr><td colspan="7" style="text-align:center;color:var(--steel);padding:24px;">No sites match this filter.</td></tr>';
      return;
    }

    document.getElementById('healthBody').innerHTML = rows.map(function (s) {
      var sig = signals(s);

      var alarmCell = sig.alarmLevel === 'none'
        ? '<span class="alarm-badge none">—</span>'
        : '<span class="alarm-badge ' + (sig.alarmLevel === 'fault' ? 'active' : 'warn') + '">'
            + sig.alarmCount
          + '</span>';

      var lastSeen = s.last_reading
        ? '<span style="font-variant-numeric:tabular-nums;font-size:12px;">' + U.escapeHtml(s.last_reading) + '</span>'
        : '<span class="empty">—</span>';

      var addrShort = s.address ? s.address.split(',').slice(-2).join(',').trim() : '';

      return '<tr>'
        + '<td>'
        +   '<span class="hc-customer">' + U.escapeHtml(s.customer_name || '—') + '</span>'
        +   '<span class="hc-sector">' + U.escapeHtml(s.sector || '') + '</span>'
        + '</td>'
        + '<td>'
        +   '<span class="hc-site">' + U.escapeHtml(s.name) + '</span>'
        +   (addrShort ? '<span class="hc-addr">' + U.escapeHtml(addrShort) + '</span>' : '')
        + '</td>'
        + '<td>' + pill(s.status, STATUS_LABEL[s.status] || s.status) + '</td>'
        + '<td>' + pill(sig.telemetry, TELEMETRY_LABEL[sig.telemetry]) + '</td>'
        + '<td>' + pill(sig.ingest,    INGEST_LABEL[sig.ingest])       + '</td>'
        + '<td>' + alarmCell + '</td>'
        + '<td>' + lastSeen + '</td>'
        + '</tr>';
    }).join('');
  }

  /* ── Sort header state ───────────────────────────────────────── */
  function updateSortHeaders() {
    document.querySelectorAll('th.sortable').forEach(function (th) {
      th.classList.remove('sort-asc', 'sort-desc');
      if (th.dataset.col === sortCol) {
        th.classList.add(sortDir === 'asc' ? 'sort-asc' : 'sort-desc');
      }
    });
  }

  /* ── Wire events ─────────────────────────────────────────────── */
  document.querySelectorAll('th.sortable').forEach(function (th) {
    th.addEventListener('click', function () {
      if (sortCol === th.dataset.col) {
        sortDir = sortDir === 'asc' ? 'desc' : 'asc';
      } else {
        sortCol = th.dataset.col;
        sortDir = 'asc';
      }
      updateSortHeaders();
      renderTable();
    });
  });

  document.getElementById('healthSearch').addEventListener('input', renderTable);

  document.getElementById('filterChips').addEventListener('click', function (e) {
    var btn = e.target.closest('[data-filter]');
    if (!btn) return;
    document.querySelectorAll('#filterChips .chip').forEach(function (c) { c.classList.remove('active'); });
    btn.classList.add('active');
    activeFilter = btn.dataset.filter;
    renderTable();
  });

  /* ── Initial render ──────────────────────────────────────────── */
  renderSummary();
  updateSortHeaders();
  renderTable();
})();
</script>
</body>
</html>
