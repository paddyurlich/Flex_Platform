<!DOCTYPE html>
<!--
  Flex Platform — browser test suite
  Open via the local dev server: http://localhost:8080/_tests.html
  (fetch() needs a server; opening as file:// will fail the static-analysis tests)
-->
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tests — Flex Platform</title>
  <script>
    try {
      var b = localStorage.getItem('flex-brand');
      if (b) document.documentElement.setAttribute('data-brand', b);
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="assets/flex-platform.css" />
  <style>
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
           background: var(--egg); color: var(--charcoal); padding: 32px; }
    h1 { font-size: 20px; font-weight: 700; margin: 0 0 4px; }
    .subtitle { color: var(--muted); font-size: 13px; margin: 0 0 28px; }
    .suite { max-width: 760px; }
    .summary { font-size: 15px; font-weight: 600; margin-bottom: 16px; }
    .summary .ok  { color: #16a34a; }
    .summary .bad { color: #dc2626; }
    .group { margin-bottom: 24px; }
    .group-title { font-size: 11px; font-weight: 800; letter-spacing: 0.12em;
                   text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
    .result { display: flex; gap: 10px; align-items: baseline;
              padding: 7px 10px; border-radius: 4px; font-size: 13px;
              border: 1px solid transparent; margin-bottom: 4px; }
    .result.pass { background: #f0fdf4; border-color: #bbf7d0; color: #166534; }
    .result.fail { background: #fef2f2; border-color: #fecaca; color: #991b1b; }
    .result .icon { font-size: 12px; flex-shrink: 0; }
    .result .label { flex: 1; }
    .result .error { font-size: 11px; color: #dc2626; margin-top: 2px; font-family: monospace; }
    [data-theme="dark"] body { background: #15130f; color: #e8e3d6; }
    [data-theme="dark"] .result.pass { background: #052e16; border-color: #166534; color: #86efac; }
    [data-theme="dark"] .result.fail { background: #450a0a; border-color: #991b1b; color: #fca5a5; }
    [data-theme="dark"] .result .error { color: #fca5a5; }
    /* hidden page chrome needed for flex-platform.js to initialise cleanly */
    .test-frame { display: none; }
  </style>
</head>
<body>

<!-- Minimal page chrome so flex-platform.js can find its expected DOM elements -->
<div class="test-frame">
  <div class="frame"><div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <div class="topbar">
        <button class="menu-btn" id="menuBtn">☰</button>
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">◑</button>
      </div>
      <main class="page" id="pageContent"></main>
    </div>
  </div></div>
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
</div>

<div class="suite">
  <h1>Flex Platform — Test Suite</h1>
  <p class="subtitle">Run at <strong>http://localhost:8080/_tests.html</strong> — fetch() tests require a server.</p>
  <div id="summary" class="summary">Running…</div>
  <div id="output"></div>
</div>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="assets/flex-nav.js"></script>
<script src="data/sites_and_customers.js"></script>
<script src="assets/flex-platform.js"></script>
<script>
(function () {
  'use strict';

  /* ── Mini test runner ──────────────────────────────────────────────── */
  var groups = [];
  var current;

  function group(name) {
    current = { name: name, results: [] };
    groups.push(current);
  }

  function test(label, fn) {
    try {
      fn();
      current.results.push({ label: label, pass: true });
    } catch (e) {
      current.results.push({ label: label, pass: false, error: e.message });
    }
  }

  function assert(condition, msg) {
    if (!condition) throw new Error(msg || 'Assertion failed');
  }

  function assertEqual(a, b) {
    if (a !== b) throw new Error('Expected "' + b + '" but got "' + a + '"');
  }

  /* ── Helpers ───────────────────────────────────────────────────────── */
  var html = document.documentElement;
  var btn  = document.getElementById('themeToggle');

  function resetTheme(t) { html.setAttribute('data-theme', t || 'light'); }
  function resetBrand(b) { html.setAttribute('data-brand', b || 'blackcurrent'); }
  function currentTheme() { return html.getAttribute('data-theme'); }
  function currentBrand() { return html.getAttribute('data-brand'); }

  /* ── Theme toggle — functional tests ──────────────────────────────── */
  group('Theme toggle — behaviour');

  test('light → dark on first click', function () {
    resetTheme('light');
    btn.click();
    assertEqual(currentTheme(), 'dark');
  });

  test('dark → light on first click', function () {
    resetTheme('dark');
    btn.click();
    assertEqual(currentTheme(), 'light');
  });

  test('two clicks return to original theme', function () {
    resetTheme('light');
    btn.click(); btn.click();
    assertEqual(currentTheme(), 'light');
  });

  test('three clicks end on opposite theme', function () {
    resetTheme('light');
    btn.click(); btn.click(); btn.click();
    assertEqual(currentTheme(), 'dark');
  });

  test('persists theme to localStorage', function () {
    resetTheme('light');
    btn.click();
    assertEqual(localStorage.getItem('flex-theme'), 'dark');
    btn.click();
    assertEqual(localStorage.getItem('flex-theme'), 'light');
  });

  /* ── Brand switcher — functional tests ────────────────────────────── */
  group('Brand switcher — behaviour');

  test('Ember button sets data-brand="ember"', function () {
    resetBrand('blackcurrent');
    var emberBtn = document.getElementById('brandBtnEmber');
    assert(emberBtn, 'brandBtnEmber not found in sidebar');
    emberBtn.click();
    assertEqual(currentBrand(), 'ember');
  });

  test('Blackcurrent button reverts data-brand', function () {
    resetBrand('ember');
    var bcBtn = document.getElementById('brandBtnBc');
    assert(bcBtn, 'brandBtnBc not found in sidebar');
    bcBtn.click();
    assertEqual(currentBrand(), 'blackcurrent');
  });

  test('Brand persists to localStorage', function () {
    document.getElementById('brandBtnEmber').click();
    assertEqual(localStorage.getItem('flex-brand'), 'ember');
    document.getElementById('brandBtnBc').click();
    assertEqual(localStorage.getItem('flex-brand'), 'blackcurrent');
  });

  test('Theme toggle still works under Ember brand', function () {
    resetBrand('ember');
    resetTheme('light');
    btn.click();
    assertEqual(currentTheme(), 'dark');
    btn.click();
    assertEqual(currentTheme(), 'light');
    resetBrand('blackcurrent');
  });

  /* ── Static analysis — no duplicate themeToggle listeners ─────────── */
  group('Static analysis — duplicate themeToggle listeners');

  var pages = [
    'index.html',
    'flex-portfolio.html',
    'flex-portfolio-sites.html',
    'flex-energy-dashboard.html',
    'flex-load-monitoring.html',
    'flex-schedule.html',
    'flex-control.html',
    'flex-tariff.html',
    'flex-assure.html',
    'flex-simulator.html',
    'flex-insights.html',
    'flex-data-export.html',
    'flex-faq.html',
  ];

  /* ── Render sync results immediately, async ones update later ──────── */
  render();

  var DUPE_RE = /getElementById\(["']themeToggle["']\)\s*\.addEventListener/g;

  Promise.all(pages.map(function (page) {
    return fetch(page)
      .then(function (r) { return r.text(); })
      .then(function (src) {
        var hits = (src.match(DUPE_RE) || []).length;
        return { page: page, hits: hits };
      })
      .catch(function (e) {
        return { page: page, hits: -1, fetchError: e.message };
      });
  })).then(function (checks) {
    var g = { name: 'Static analysis — duplicate themeToggle listeners', results: [] };
    checks.forEach(function (c) {
      if (c.fetchError) {
        g.results.push({ label: c.page + ' (fetch failed — run via server)', pass: false, error: c.fetchError });
      } else if (c.hits > 0) {
        g.results.push({ label: c.page, pass: false,
          error: 'Found ' + c.hits + ' inline themeToggle.addEventListener — remove it, use MutationObserver instead' });
      } else {
        g.results.push({ label: c.page, pass: true });
      }
    });
    /* Replace placeholder group with real results */
    for (var i = 0; i < groups.length; i++) {
      if (groups[i].name === g.name) { groups[i] = g; break; }
    }
    render();
  });

  /* ── Render ────────────────────────────────────────────────────────── */
  function render() {
    var totalPass = 0, totalFail = 0;
    var out = '';

    groups.forEach(function (g) {
      var gPass = g.results.filter(function (r) { return r.pass; }).length;
      var gFail = g.results.filter(function (r) { return !r.pass; }).length;
      totalPass += gPass; totalFail += gFail;

      out += '<div class="group">'
        + '<div class="group-title">' + g.name
        + ' <span style="font-weight:400;letter-spacing:0">('
        + gPass + '/' + (gPass + gFail) + ')</span></div>';

      g.results.forEach(function (r) {
        out += '<div class="result ' + (r.pass ? 'pass' : 'fail') + '">'
          + '<span class="icon">' + (r.pass ? '✓' : '✗') + '</span>'
          + '<div><div class="label">' + r.label + '</div>'
          + (r.error ? '<div class="error">' + r.error + '</div>' : '')
          + '</div></div>';
      });
      out += '</div>';
    });

    document.getElementById('output').innerHTML = out;
    document.getElementById('summary').innerHTML = totalFail === 0
      ? '<span class="ok">All ' + totalPass + ' tests passed.</span>'
      : '<span class="bad">' + totalFail + ' failed</span>, '
        + '<span class="ok">' + totalPass + ' passed</span>.';
  }

})();
</script>
</body>
</html>
